name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * 1"   # 매주 월요일: 최신 yt-dlp로 자동 재빌드

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Download deno (YouTube 해독용 JS 런타임)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath .
      - run: flet pack main.py --name ReelDock --product-name ReelDock --hidden-import yt_dlp --hidden-import gallery_dl --collect-all gallery_dl --collect-all yt_dlp_ejs --add-binary "deno.exe;."
      - uses: actions/upload-artifact@v4
        with: { name: ReelDock-exe, path: dist/ReelDock.exe }

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: pip install "flet[all]==0.28.3"
      - run: flet build apk
      - uses: actions/upload-artifact@v4
        with: { name: ReelDock-apk, path: build/apk/*.apk }
